# GitLab CI — every job here is currently dormant. See wiki/CI_GITHUB_MIRROR.md.
#
# ┌─ PAUSED ────────────────────────────────────────────────────────────────────
# │ This project's GitLab compute quota is exhausted. Any pipeline GitLab
# │ creates fails instantly with `ci_quota_exceeded` — the jobs never even
# │ start — which paints main and every MR red for no reason. The `workflow:`
# │ block below therefore creates no pipeline at all.
# │
# │ That applies to the merge gate too: `github-ci-gate` needs GitLab compute to
# │ poll the GitHub result, which is precisely what is missing, so it can never
# │ run. It stays defined, and ci-tools/check-github-ci.py stays in the repo,
# │ ready for the day the quota returns.
# │
# │ CI runs on GitHub Actions instead: a push mirror copies every ref to
# │ github.com/NacciVittorio/fininzen (public repo → free minutes), where
# │ .github/workflows/ci.yml runs these same ci-tools/*.sh scripts and posts the
# │ result back onto the commit, so it shows in the MR widget here.
# │ .github/workflows/release.yml likewise creates the GitLab Release over the
# │ API, standing in for the `release` job below.
# │
# │ To come back to GitLab CI: restore the `workflow:` rules kept commented out
# │ below, swap the jobs off `.ci-rules`, and disable the mirror.
# └─────────────────────────────────────────────────────────────────────────────

stages:
  - gate
  - lint
  - test
  - build
  - release

# Create no pipeline, ever — see the PAUSED note above. This is deliberately a
# no-op `workflow:` rather than disabling CI/CD in the project settings, because
# that would also hide the pipeline widget in the MR, which is exactly where the
# GitHub Actions commit status needs to appear.
workflow:
  rules:
    - when: never
    # ── Original rules, to restore when the compute quota is back ──
    # Gate the whole pipeline: MRs, main, version tags, and the weekly Renovate
    # schedule. Without this a push to a branch with an open MR builds twice (a
    # branch pipeline and a detached MR pipeline).
    #
    # - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # - if: $CI_COMMIT_TAG =~ /^v/
    # - if: $CI_PIPELINE_SOURCE == "schedule"
    # - when: never

default:
  # Cancel superseded pipelines when a new commit lands on the same ref.
  interruptible: true

# ── Shared config ─────────────────────────────────────────────────────────────

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  # Shared Django vars for non-production jobs (no DB guard, no security checks).
  DJANGO_SECRET_KEY: "ci-secret-key-for-fininzen-tests-with-more-than-50-characters"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

# Every job is GitHub-only for now. On GitLab they stay defined but never
# scheduled so the mirror can keep using the same shared job bodies, and so the
# switch back is a one-line change per job.
.ci-rules:
  rules:
    - when: never

.python:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip

.node:
  # Debian-based, not -alpine: the ci-tools scripts are bash, which Alpine lacks.
  image: node:24-slim
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm

.postgres-service:
  services:
    - name: postgres:16-alpine
      alias: postgres

# ── Gate ──────────────────────────────────────────────────────────────────────

# Waits for the GitHub Actions CI result on this SHA and fails the MR if GitHub
# is red — the piece that would make the mirrored result an actual merge check
# rather than a status you have to read yourself.
#
# Dormant: polling GitHub costs GitLab compute, and the quota that funds it is
# the very thing that is exhausted. Until then the GitHub result reaches the MR
# widget as a commit status (posted by the `gitlab-status` job in
# .github/workflows/ci.yml), visible but not enforceable — External Status
# Checks, which could enforce it, are Ultimate-only.
github-ci-gate:
  extends: .ci-rules
  stage: gate
  image: python:3.12-slim
  variables:
    GITHUB_REPOSITORY: NacciVittorio/fininzen
  script:
    - python ci-tools/check-github-ci.py

backend-lint:
  extends:
    - .python
    - .ci-rules
  stage: lint
  script:
    - bash ci-tools/install-backend.sh
    - bash ci-tools/lint-backend.sh

web-lint:
  extends:
    - .node
    - .ci-rules
  stage: lint
  script:
    - bash ci-tools/install-web.sh
    - bash ci-tools/lint-web.sh

# ── Test ──────────────────────────────────────────────────────────────────────

# Migration drift check + full pytest suite.
backend-test:
  extends:
    - .python
    - .postgres-service
    - .ci-rules
  stage: test
  variables:
    POSTGRES_DB: fininzen_test
    POSTGRES_USER: fininzen
    POSTGRES_PASSWORD: fininzen
    DATABASE_URL: "postgres://fininzen:fininzen@postgres/fininzen_test"
  script:
    - bash ci-tools/install-backend.sh
    - bash ci-tools/check-migrations.sh
    - bash ci-tools/test-backend.sh

# Verifies migrate + pytest on the production engine (sequences, JSON/array SQL,
# encrypted columns) — behaviour SQLite can't cover.
backend-postgres:
  extends:
    - .python
    - .postgres-service
    - .ci-rules
  stage: test
  variables:
    POSTGRES_DB: fininzen
    POSTGRES_USER: fininzen
    POSTGRES_PASSWORD: fininzen
    DATABASE_URL: "postgres://fininzen:fininzen@postgres/fininzen"
  script:
    - bash ci-tools/install-backend.sh
    - bash ci-tools/migrate.sh
    - bash ci-tools/test-backend.sh

# Regenerate openapi.json + schema.d.ts and fail if either is stale.
# Needs both Python and Node; uses the nikolaik combined image.
api-contract:
  extends: .ci-rules
  stage: test
  image: nikolaik/python-nodejs:python3.12-nodejs22
  cache:
    - key: pip-$CI_COMMIT_REF_SLUG
      paths:
        - .cache/pip
    - key: npm-$CI_COMMIT_REF_SLUG
      paths:
        - .cache/npm
  variables:
    DJANGO_DEBUG: "1"
  script:
    - bash ci-tools/install-backend.sh
    - bash ci-tools/install-web.sh
    - bash ci-tools/check-api-contract.sh

# Playwright E2E against a throwaway SQLite-backed Django dev server; Next runs
# as Playwright's own webServer, built for production in CI (see
# web/playwright.config.ts). Needs both Python and Node — nikolaik image, like
# api-contract.
e2e-test:
  extends: .ci-rules
  stage: test
  image: nikolaik/python-nodejs:python3.12-nodejs22
  cache:
    - key: pip-$CI_COMMIT_REF_SLUG
      paths:
        - .cache/pip
    - key: npm-$CI_COMMIT_REF_SLUG
      paths:
        - .cache/npm
  script:
    - bash ci-tools/install-backend.sh
    - bash ci-tools/install-web.sh
    - bash ci-tools/test-e2e.sh

# ── Build ─────────────────────────────────────────────────────────────────────

web-build:
  extends:
    - .node
    - .ci-rules
  stage: build
  needs:
    - web-lint
  script:
    - bash ci-tools/install-web.sh
    - bash ci-tools/build-web.sh

# ── Release ───────────────────────────────────────────────────────────────────

# `just release` runs `cz bump` locally (writing VERSION + CHANGELOG.md and
# creating the annotated vX.Y.Z tag) and pushes it; this job turns that tag into
# a GitLab Release whose notes come from the CHANGELOG. See wiki/VERSIONING.md.
#
# Dormant like the rest: a tag pipeline dies on `ci_quota_exceeded` before this
# runs, which is how v0.11.0 shipped on GitHub with no GitLab Release to match.
# The "Create GitLab Release" step in .github/workflows/release.yml now does
# this over the API, from the same RELEASE_NOTES.md that ci-tools/release-notes.sh
# produces here. Re-enable this job only together with removing that step, or
# the two will race for the same release.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # A release must never be cancelled halfway by a subsequent pipeline.
  interruptible: false
  rules:
    - when: never
    # ── Original rule, to restore when the compute quota is back ──
    # - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    # The release-cli image is Alpine; ci-tools/*.sh need bash.
    - apk add --no-cache bash
  script:
    - bash ci-tools/release-notes.sh
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: RELEASE_NOTES.md

# ── Dependencies ──────────────────────────────────────────────────────────────

# Replaces Dependabot, which is GitHub-only. Runs from a weekly pipeline
# schedule (Settings → CI/CD → Pipeline schedules) and needs RENOVATE_TOKEN — a
# project access token with `api` + `write_repository` — as a masked CI
# variable. Config lives in .github/renovate.json. Until the token exists the rule keeps
# the job from running at all.
#
# Superseded while the quota is exhausted by .github/workflows/renovate.yml,
# which runs this same image on GitHub Actions with RENOVATE_PLATFORM=gitlab, so
# the MRs still open here. Keep the two in sync if the env vars below change.
renovate:
  stage: lint
  image: renovate/renovate:latest@sha256:09227c6db2149184204d95036efbf54b7fc3dab6802b8498c5f5c363cfc0a1f6
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    # RENOVATE_TOKEN is read straight from the masked CI variable; redefining it
    # here would shadow it with a self-reference.
  script:
    - renovate
