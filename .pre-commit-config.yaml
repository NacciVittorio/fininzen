# Shared git pre-commit hooks. Mirrors CI's lint stage (ruff + prettier) and
# adds basic hygiene + secret guards.
#
# Setup:  just hooks       (runs `pre-commit install`)
# Run all: just hooks-run   (runs `pre-commit run --all-files`)
minimum_pre_commit_version: "4.0.0"

# Generated artifacts: never let a hook reformat these, or they drift from what
# the codegen (just schema / npm run generate:api) produces and the CI
# api-contract job fails.
exclude: '^(openapi\.json|web/src/api/schema\.d\.ts|\.devenv/)'

repos:
  # ---- Python: lint + format (Nix-provided binary via devenv, avoids stub-ld) ----
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: ruff format
        language: system
        types: [python]

  # ---- Web (Next.js): prettier via the project's own pinned binary ----
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web/src)
        entry: web/node_modules/.bin/prettier --write
        language: system
        files: ^web/src/.*\.(ts|tsx|js|jsx|css|json)$

  # ---- Basic hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  # ---- Secret guard (Nix-provided binary via devenv, avoids stub-ld) ----
  - repo: local
    hooks:
      - id: ripsecrets
        name: ripsecrets
        entry: ripsecrets
        language: system
        pass_filenames: false
