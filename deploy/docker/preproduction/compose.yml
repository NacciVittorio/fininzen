# Homelab preproduction override. Merge with ../production/compose.yml.
# Caddy is deliberately disabled unless the standalone profile is requested;
# Nginx Proxy Manager reaches frontend/backend on the shared proxy network.
services:
  backend:
    networks:
      default: {}
      proxy:
        aliases:
          - fininzen-preprod-api

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-vittorio.nacci@nacci.eu}
    networks:
      default: {}
      proxy:
        aliases:
          - fininzen-preprod-web

  caddy:
    profiles:
      - standalone

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nacci_proxy}
