# Full containerized stack — Next.js + Django + Postgres + Redis.
#
# An existing Nginx/Nginx Proxy Manager instance is the public reverse proxy.
# It joins the external `proxy` network; no application port is exposed on the
# Docker host. See wiki/DOCKER_DEPLOY.md.
#
#   cp deploy/docker/production/.env.example deploy/docker/production/.env   # then edit
#   docker compose --env-file deploy/docker/production/.env \
#     -f deploy/docker/production/compose.yml up -d --build
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fininzen}
      POSTGRES_USER: ${POSTGRES_USER:-fininzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fininzen} -d ${POSTGRES_DB:-fininzen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../..
      dockerfile: deploy/docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-1}
      POSTGRES_DB: ${POSTGRES_DB:-fininzen}
      POSTGRES_USER: ${POSTGRES_USER:-fininzen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?set FIELD_ENCRYPTION_KEYS}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Nginx preserves the browser-visible /api/auth/* path.
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth/}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Fininzen}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost}
    volumes:
      - staticfiles:/app/staticfiles
    networks:
      default: {}
      proxy:
        aliases:
          - ${PROXY_API_UPSTREAM:-fininzen-api}

  frontend:
    build:
      context: ../../..
      dockerfile: deploy/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side (SSR/RSC) calls go straight to Django over the compose
      # network; browser calls use the relative /api path via Nginx.
      DJANGO_ORIGIN: ${DJANGO_ORIGIN:-http://backend:8000}
    networks:
      default: {}
      proxy:
        aliases:
          - ${PROXY_WEB_UPSTREAM:-fininzen-web}

volumes:
  postgres_data:
  staticfiles:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in the production environment file}
