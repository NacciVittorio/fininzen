server {
    listen 80;
    server_name _;

    # collectstatic writes files without the browser-visible /static prefix.
    # `alias` deliberately strips it before resolving the file on the volume.
    location /static/ {
        alias /usr/share/nginx/html/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        return 404;
    }
}
