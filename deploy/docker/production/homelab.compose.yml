# Homelab production-test overlay. Merge with compose.yml.
# Caddy remains disabled; Nginx Proxy Manager reaches the web and API services
# over the shared external proxy network.
services:
  backend:
    networks:
      default: {}
      proxy:
        aliases:
          - fininzen-production-api

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-vittorio.nacci@nacci.eu}
    networks:
      default: {}
      proxy:
        aliases:
          - fininzen-production-web

  caddy:
    profiles:
      - standalone

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nacci_proxy}
