# Ruff configuration.
#
# Ruff 0.16.0 widened its default rule selection from 59 rules to 413. With no
# config file in the repo the effective lint contract was whatever ruff happened
# to ship as defaults, so the Renovate bump 0.15.21 -> 0.16.0 turned a green tree
# into 1023 errors without a single line of project code changing.
#
# Pinning `select` here makes the contract explicit and immune to future default
# changes: widening it becomes a deliberate commit, not a side effect of
# `pip install -r requirements.txt`. This is the pre-0.16 default set.
# See https://astral.sh/blog/ruff-v0.16.0

[lint]
select = ["E4", "E7", "E9", "F"]
